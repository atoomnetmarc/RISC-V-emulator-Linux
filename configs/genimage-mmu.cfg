image boot.ext4 {
	ext4 {
		label = "boot"
		use-mke2fs = true
	}
	size = 32M
	mountpoint = "/"
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "boot.ext4"
		offset = 1M
		partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
		partition-uuid = 7a4e3b2c-1d5f-4a6b-9c8d-0e1f2a3b4c5d
		bootable = true
	}

	partition rootfs {
		image = "rootfs.ext4"
		offset = 33M
		partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
		partition-uuid = 6f3d2a1e-9c4b-4e7a-8b1d-2c5e7f9a0b3c
	}
}
